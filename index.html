<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6학년 2반 꿈 포스터 헤드카피 보석함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --secondary: #06B6D4;
      --accent: #F59E0B;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-sub: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #312E81 0%, #4F46E5 50%, #7C3AED 100%);
      color: white;
      padding: 48px 24px 36px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.15);
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 2.4rem;
      font-weight: 400;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.05rem;
      opacity: 0.9;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Search & Filter Bar */
    .toolbar {
      max-width: 1200px;
      margin: -24px auto 32px;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: white;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 1.1rem;
    }

    .stat-pill {
      background: white;
      border-radius: 14px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--primary);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    /* Grid */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    /* Student Card */
    .student-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .student-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.1);
      border-color: #CBD5E1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .student-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .job-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .tag-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tag {
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 6px;
      background: #F1F5F9;
      color: #475569;
      font-weight: 600;
    }

    .headline-preview {
      background: #F8FAFC;
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 14px;
    }

    .headline-preview .label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: block;
    }

    .headline-preview .text {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #0F172A;
      word-break: keep-all;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .view-btn {
      color: var(--primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 860px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalSlide 0.25s ease-out;
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      border-radius: 24px 24px 0 0;
    }

    .close-btn {
      background: #F1F5F9;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-sub);
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #E2E8F0;
      color: var(--text-main);
    }

    .modal-body {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Custom Headline Input */
    .custom-input-box {
      background: #FFFBEB;
      border: 2px dashed #F59E0B;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .custom-input-box label {
      font-size: 0.85rem;
      font-weight: 800;
      color: #B45309;
      display: flex;
      justify-content: space-between;
    }

    .custom-input-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #FCD34D;
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
      color: #78350F;
      outline: none;
      background: white;
    }

    .custom-input-box input:focus {
      border-color: #F59E0B;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }

    /* Headline Options */
    .section-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .headline-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-card {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .option-card:hover {
      border-color: #A5B4FC;
      background: #F8FAFC;
    }

    .option-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .option-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .option-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
    }

    .option-text {
      font-family: 'Jua', sans-serif;
      font-size: 1.3rem;
      color: var(--text-main);
    }

    .option-len {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
    }

    /* Poster Mockup */
    .poster-preview-box {
      background: #334155;
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .poster-mockup {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1.414; /* 8절지 비율 */
      background: white;
      border-radius: 6px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      box-sizing: border-box;
      position: relative;
    }

    .mockup-header {
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      color: #1E1B4B;
      padding: 10px;
      background: #FEF3C7;
      border: 2px dashed #F59E0B;
      border-radius: 8px;
      word-break: keep-all;
    }

    .mockup-drawing-area {
      flex: 1;
      margin: 16px 0;
      border: 2px dashed #CBD5E1;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #94A3B8;
      background: #F8FAFC;
      font-size: 0.9rem;
      gap: 6px;
    }

    .mockup-footer {
      background: #EEF2FF;
      border: 2px solid #818CF8;
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #1E1B4B;
      line-height: 1.45;
      word-break: keep-all;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.08);
    }

    /* Original Info Box */
    .orig-box {
      background: #F8FAFC;
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .orig-row {
      display: flex;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .orig-label {
      width: 100px;
      font-weight: 700;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .orig-val {
      color: var(--text-main);
    }

    /* Print Controls */
    .copy-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #4338CA;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }
      header, .toolbar, .modal-backdrop {
        display: none !important;
      }
      .students-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .student-card {
        break-inside: avoid;
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">🎨 6학년 2반 가치관 & 꿈 선언 포스터</div>
    <h1>내가 꿈꾸는 나! 한 줄 헤드카피 보석함</h1>
    <p>아이들이 8절지에 그림과 함께 시원하게 적을 수 있는 맞춤형 헤드카피 추천안입니다. 학생 이름을 클릭하면 8절지 배치 시뮬레이션을 확인할 수 있습니다.</p>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="학생 이름이나 직업으로 검색해보세요 (예: 하윤, 유튜버)...">
    </div>
    <div class="stat-pill">
      <span>총 22명의 꿈</span>
    </div>
  </div>

  <main class="container">
    <div class="students-grid" id="studentsGrid"></div>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="job-badge" id="modalJob">직업</span>
          <h2 id="modalName" style="font-size: 1.4rem; font-weight: 800;">학생 이름</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="close-btn" onclick="prevStudent()" title="이전 학생">◀</button>
          <button class="close-btn" onclick="nextStudent()" title="다음 학생">▶</button>
          <button class="close-btn" onclick="closeModal()" title="닫기">✕</button>
        </div>
      </div>

      <div class="modal-body">
        <!-- Headline Options -->
        <div>
          <div class="section-title">✨ 추천 헤드카피 (클릭하여 8절지 배치 확인)</div>
          <div class="headline-options" id="headlineOptions"></div>
        </div>

        <!-- Custom Headline Input -->
        <div class="custom-input-box">
          <label>
            <span>✍️ 나만의 문장으로 직접 수정해보기 (세로형 포스터 제목)</span>
            <span id="customCharCount" style="font-weight: 700; color: #B45309;">0자</span>
          </label>
          <input type="text" id="customInput" placeholder="추천 문구를 바꾸거나 내가 쓰고 싶은 멋진 문장을 입력해보세요..." oninput="onCustomInputChange(this.value)">
        </div>

        <!-- 8절지 미리보기 -->
        <div>
          <div class="section-title">📐 8절지 세로형 포스터 실시간 완성 미리보기</div>
          <div class="poster-preview-box">
            <div class="poster-mockup">
              <div class="mockup-header" id="mockupHeadline">헤드카피가 들어가는 자리</div>
              <div class="mockup-drawing-area">
                <span style="font-size: 2.2rem;">🎨</span>
                <span style="font-weight: 800; color: #475569; font-size: 1.05rem;">내가 꿈꾸는 내 모습 그림</span>
                <span style="font-size: 0.8rem; color: #94A3B8;">(도화지 중앙에 주인공과 배경을 큼직하게 그려요!)</span>
              </div>
              <div>
                <div class="mockup-footer" id="mockupSubcopy">하단 서브카피</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 원본 가치관 정보 -->
        <div class="orig-box">
          <div class="orig-row">
            <span class="orig-label">핵심 가치관</span>
            <span class="orig-val" id="modalValues"></span>
          </div>
          <div class="orig-row">
            <span class="orig-label">선택 이유</span>
            <span class="orig-val" id="modalReason"></span>
          </div>
          <div class="orig-row">
            <span class="orig-label">기존 선언문</span>
            <span class="orig-val" id="modalOriginal" style="color: #4F46E5; font-weight: 600;"></span>
          </div>
        </div>

        <button class="copy-btn" id="copyBtn" onclick="copySelectedHeadline()">
          📋 현재 화면의 헤드카피 복사하기
        </button>
      </div>
    </div>
  </div>

  <script>
    const studentsData = [
      {
        id: 1,
        name: "권하윤",
        job: "요리사",
        val1: "좋은 동료 (공동체)",

          { tag: "추천 2 (동료/화목)", text: "함께 웃으며 정을 나누는 요리사", note: "16자 · 공동체 가치관" },
          { tag: "추천 3 (직관형)", text: "마음을 담아 행복을 만드는 요리사", note: "17자 · 행복 추구" }
        ]
      },
      {
        id: 2,

        reason: "포기하지 않고 내 몸을 지키고 나의 몸으로 다른 사람에게 응원 받고 싶어",
        orig: "나만의 특기를 살려, 상대를 두려워하지 않는 복싱 선수",
        headlines: [
          { tag: "추천 1 (용기/도전)", text: "두려움 없이 도전하는 당당한 챔피언", note: "18자 · 자신감" },
          { tag: "추천 2 (파워형)", text: "용기로 링을 지배하는 복싱 선수", note: "16자 · 힘찬 에너지" },
          { tag: "추천 3 (희망형)", text: "나만의 펀치로 희망을 전하는 복서", note: "17자 · 응원과 극복" }
        ]
      },
      {
        id: 3,
        name: "김슬찬",
        job: "유튜버",
        val1: "좋은 동료 (공동체)",
        val2: "소통과 공감",
        reason: "사람들과 소통하며 게임을 즐기는 게 재밌고 웃음이 적어질까 봐 소중한 직업",
        orig: "좋은 동료들과 즐겁게 호흡을 맞추며, 따뜻한 공감으로 사람들의 마음을 이어주는 유튜버",
        headlines: [
          { tag: "추천 1 (직관형)", text: "마음을 잇고 웃음을 전하는 유튜버", note: "16자 · 소통과 재미" },
          { tag: "추천 2 (가치관 강조)", text: "함께 소통하는 따뜻한 공감 유튜버", note: "16자 · 공감 중심" },
          { tag: "추천 3 (친근형)", text: "세상과 친구가 되는 유쾌한 방송인", note: "17자 · 밝은 소통" }
        ]
      },
      {
        id: 4,
        name: "김시아",
        job: "화가",
        val1: "쾌적한 근무환경",
        val2: "진리와 발견",
        reason: "그저 평범한 사람이지만 언젠간 그렇게 되든 행복한 게 좋은 것이다",

          { tag: "추천 3 (스마트)", text: "정의로운 눈으로 바른 길을 찾는 든든한 세무사", note: "21자 · 전문성" }
        ]
      },
      {
        id: 21,
        name: "서우진",
        job: "가상현실전문가",
        val1: "경제적 보상 / 끈기",
        val2: "가족과 화목 / 도전과 용기",
        reason: "나는 끈기가 있고 보수가 중요하기 때문이다",
        orig: "성실한 노력으로 경제적 여유를 일구며, 새로운 길을 개척하는 열정으로 용기를 북돋는 가상현실전문가",
        headlines: [
          { tag: "추천 1 (개척형)", text: "새로운 세상을 개척하는 도전형 VR 전문가", note: "20자 · 미래지향" },
          { tag: "추천 2 (열정형)", text: "끝없는 도전으로 미래를 여는 가상현실전문가", note: "21자 · 끈기와 용기" },
          { tag: "추천 3 (상상형)", text: "열정과 상상력으로 가상세계를 빚는 전문가", note: "20자 · 창조적" }
        ]
      },
      {
        id: 22,
        name: "이하윤",
        job: "유튜버",
        val1: "자율성",
        val2: "기쁨과 행복",
        reason: "사람들을 웃기는 걸 좋아하고 자유롭게 노는 것과 게임하는 걸 좋아하기 때문",
        orig: "나만의 아이디어를 자유롭게 펼치며, 일상 속에 유쾌한 기쁨과 밝은 활력을 불어넣는 유튜버",
        headlines: [
          { tag: "추천 1 (웃음형)", text: "팡팡 튀는 아이디어로 큰 웃음을 주는 유튜버", note: "21자 · 유쾌한 끼" },
          { tag: "추천 2 (자유형)", text: "자유로운 상상으로 활력을 채우는 유쾌한 방송인", note: "22자 · 자율성" },
          { tag: "추천 3 (해피형)", text: "세상을 유쾌하게 물들이는 해피 크리에이터", note: "20자 · 밝은 에너지" }
        ]
      }
    ];

    let currentStudent = null;
    let selectedHeadlineIndex = 0;

    const grid = document.getElementById('studentsGrid');
    const searchInput = document.getElementById('searchInput');

    function renderStudents(list) {
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94A3B8;">
          <p style="font-size: 1.2rem; font-weight: 700;">검색 결과가 없습니다.</p>
        </div>`;
        return;
      }

      list.forEach(s => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.onclick = () => openModal(s);

        card.innerHTML = `
          <div class="card-top">
            <div class="student-name">
              <span>${s.name}</span>
            </div>
            <span class="job-badge">${s.job}</span>
          </div>

          <div class="tag-list">
            <span class="tag">#${s.val1.split(' ')[0]}</span>
            <span class="tag">#${s.val2.split(' ')[0]}</span>
          </div>

          <div class="headline-preview">
            <span class="label">대표 헤드카피</span>
            <div class="text">"${s.headlines[0].text}"</div>
          </div>

          <div class="card-footer">
            <span>추천 문구 3개 준비됨</span>
            <span class="view-btn">포스터 보기 ➔</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = studentsData.filter(s => 
        s.name.toLowerCase().includes(q) || 
        s.job.toLowerCase().includes(q) ||
        s.val1.toLowerCase().includes(q) ||
        s.val2.toLowerCase().includes(q) ||
        s.headlines.some(h => h.text.toLowerCase().includes(q))
      );
      renderStudents(filtered);
    });

    function openModal(student) {
      currentStudent = student;
      selectedHeadlineIndex = 0;

      document.getElementById('modalName').textContent = `${student.name}의 꿈 포스터`;
      document.getElementById('modalJob').textContent = student.job;
      document.getElementById('modalValues').textContent = `${student.val1} + ${student.val2}`;
      document.getElementById('modalReason').textContent = student.reason;
      document.getElementById('modalOriginal').textContent = `"${student.orig}"`;
      // 끝부분 정리 후 "직업, [이름]" 형태로 2줄 완성
      const cleanOrig = student.orig.replace(/["'”’.\s]+$/, '');
      const fullText = `${cleanOrig}, ${student.name}`;
      const twoLines = fullText.replace(/,\s*/, ',<br>');
      document.getElementById('mockupSubcopy').innerHTML = `"${twoLines}"`;

      renderOptions();
      updateMockup();

      document.getElementById('modalBackdrop').classList.add('active');
      document.body.style.overflow = 'hidden';

      const customInp = document.getElementById('customInput');
      customInp.value = '';
      document.getElementById('customCharCount').textContent = '0자';
    }

    function prevStudent() {
      if (!currentStudent) return;
      const idx = studentsData.findIndex(s => s.id === currentStudent.id);
      const prevIdx = (idx - 1 + studentsData.length) % studentsData.length;
      openModal(studentsData[prevIdx]);
    }

    function nextStudent() {
      if (!currentStudent) return;
      const idx = studentsData.findIndex(s => s.id === currentStudent.id);
      const nextIdx = (idx + 1) % studentsData.length;
      openModal(studentsData[nextIdx]);
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function renderOptions() {
      const container = document.getElementById('headlineOptions');
      container.innerHTML = '';

      currentStudent.headlines.forEach((h, idx) => {
        const opt = document.createElement('div');
        opt.className = `option-card ${idx === selectedHeadlineIndex ? 'selected' : ''}`;
        opt.onclick = () => {
          selectedHeadlineIndex = idx;
          document.getElementById('customInput').value = '';
          document.getElementById('customCharCount').textContent = '0자';
          renderOptions();
          updateMockup();
        };

        opt.innerHTML = `
          <div class="option-info">
            <span class="option-tag">${h.tag} · ${h.note}</span>
            <span class="option-text">"${h.text}"</span>
          </div>
          <span class="option-len">${h.text.length}자</span>
        `;
        container.appendChild(opt);
      });
    }

    function onCustomInputChange(val) {
      document.getElementById('customCharCount').textContent = `${val.length}자`;
      if (val.trim().length > 0) {
        selectedHeadlineIndex = -1; // Unselect preset cards
        const cards = document.querySelectorAll('.option-card');
        cards.forEach(c => c.classList.remove('selected'));
        document.getElementById('mockupHeadline').textContent = val;
      } else {
        selectedHeadlineIndex = 0;
        renderOptions();
        updateMockup();
      }
    }

    function updateMockup() {
      if (selectedHeadlineIndex >= 0) {
        const chosen = currentStudent.headlines[selectedHeadlineIndex];
        document.getElementById('mockupHeadline').textContent = chosen.text;
      }
    }

    function copySelectedHeadline() {
      const textToCopy = document.getElementById('mockupHeadline').textContent;
      navigator.clipboard.writeText(textToCopy).then(() => {
        const btn = document.getElementById('copyBtn');
        const oldText = btn.innerHTML;
        btn.innerHTML = '✅ 복사 완료!';
        btn.style.background = '#10B981';
        setTimeout(() => {
          btn.innerHTML = oldText;
          btn.style.background = 'var(--primary)';
        }, 1500);
      });
    }

    // Keyboard navigation (Arrow left/right, ESC)
    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('modalBackdrop');
      if (modal.classList.contains('active')) {
        if (e.key === 'Escape') closeModal();
        if (e.target.tagName !== 'INPUT') {
          if (e.key === 'ArrowLeft') prevStudent();
          if (e.key === 'ArrowRight') nextStudent();
        }
      }
    });

    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });

    // Initial render
    renderStudents(studentsData);
  </script>
</body>
</html>
