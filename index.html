<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1E1B4B 0%, #3730A3 50%, #4F46E5 100%);
      color: white;
      padding: 36px 20px 28px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 2.1rem;
      font-weight: 400;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
      word-break: keep-all;
    }

    /* Toolbar */
    .toolbar {
      max-width: 1200px;
      margin: -20px auto 24px;
      padding: 0 16px;
      display: flex;
      gap: 10px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 13px 18px 13px 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: #94A3B8;
    }

    .stat-pill {
      background: white;
      border-radius: 12px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--primary);
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    /* Grid */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    /* Card */
    .student-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
      transition: all 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .student-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 25px -8px rgba(0, 0, 0, 0.1);
      border-color: #818CF8;
    }

    .card-thumb-wrap {
      width: 100%;
      aspect-ratio: 1200 / 860;
      background: #0F172A;
      overflow: hidden;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.25s;
    }

    .student-card:hover .card-thumb {
      transform: scale(1.02);
    }

    .card-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .student-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .job-badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .headline-preview-pill {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 4px;
      margin-bottom: 10px;
    }

    .headline-preview-pill .label {
      font-size: 0.7rem;
      font-weight: 800;
      color: #B45309;
      display: block;
      margin-bottom: 2px;
    }

    .headline-preview-pill .text {
      font-family: 'Jua', sans-serif;
      font-size: 1.1rem;
      color: #78350F;
      word-break: keep-all;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .view-btn {
      color: var(--primary);
      font-weight: 800;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 860px;
      max-height: 94vh;
      overflow-y: auto;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      position: relative;
      animation: modalSlide 0.2s ease-out;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: scale(0.97) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
      z-index: 20;
    }

    .close-btn {
      background: #F1F5F9;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      color: var(--text-sub);
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #E2E8F0;
      color: var(--text-main);
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Original Image Section */
    .orig-image-card {
      background: #0F172A;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      border: 1px solid #334155;
    }

    .orig-image-card img {
      width: 100%;
      display: block;
      aspect-ratio: 1200 / 860;
      object-fit: contain;
      background: #0F172A;
    }

    /* Headline Options Section */
    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-item {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      background: white;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .option-item:hover {
      border-color: #818CF8;
      background: #F8FAFC;
    }

    .option-item.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.12);
    }

    .option-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #E0E7FF;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .option-item.selected .option-num {
      background: var(--primary);
      color: white;
    }

    .option-text {
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      color: #0F172A;
      word-break: keep-all;
    }

    .option-len {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 700;
      white-space: nowrap;
    }

    /* Custom Input */
    .custom-box {
      background: #F8FAFC;
      border: 2px dashed #CBD5E1;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .custom-box label {
      font-size: 0.85rem;
      font-weight: 800;
      color: #475569;
      display: flex;
      justify-content: space-between;
    }

    .custom-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      color: #1E1B4B;
      outline: none;
      background: white;
    }

    .custom-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">🎨 6학년 2반 꿈 포스터</div>
    <h1>내가 꿈꾸는 나! 추천 헤드카피</h1>
    <p>나의 꿈 카드를 보고, 내 그림에 가장 잘 어울리는 멋진 제목을 골라보세요!</p>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="내 이름 검색 (예: 하윤, 준영, 슬찬)...">
    </div>
    <div class="stat-pill">
      <span>22명</span>
    </div>
  </div>

  <main class="container">
    <div class="students-grid" id="studentsGrid"></div>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="job-badge" id="modalJob">직업</span>
          <h2 id="modalName" style="font-size: 1.35rem; font-weight: 800;">학생 이름</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <button class="close-btn" onclick="prevStudent()" title="이전 친구">◀</button>
          <button class="close-btn" onclick="nextStudent()" title="다음 친구">▶</button>
          <button class="close-btn" onclick="closeModal()" title="닫기">✕</button>
        </div>
      </div>

      <div class="modal-body">
        <!-- 원본 카드 이미지 -->
        <div class="orig-image-card">
          <img id="modalImg" src="" alt="꿈카드 원본 이미지">
        </div>

        <!-- 딱 3가지 추천 헤드카피 -->
        <div>
          <div class="section-title">
            <span>✨ 추천 헤드카피 (3가지 중 마음에 드는 문구를 골라보세요)</span>
          </div>
          <div class="options-grid" id="optionsGrid"></div>
        </div>

        <!-- 나만의 문장 직접 쓰기 -->
        <div class="custom-box">
          <label>
            <span>✍️ 내가 직접 단어를 바꾸거나 써보고 싶다면?</span>
            <span id="charCount" style="color: #64748B;">0자</span>
          </label>
          <input type="text" id="customInput" placeholder="여기에 나만의 문장을 직접 적어보세요..." oninput="onCustomType(this.value)">
        </div>
      </div>
    </div>
  </div>

    let currentStudent = null;
    let selectedHeadline = "";

    const grid = document.getElementById('studentsGrid');
    const searchInput = document.getElementById('searchInput');

    function renderStudents(list) {
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94A3B8;">
          <p style="font-size: 1.1rem; font-weight: 700;">검색 결과가 없습니다.</p>
        </div>`;
        return;
      }

      list.forEach(s => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.onclick = () => openModal(s);

        card.innerHTML = `
          <div class="card-thumb-wrap">
            <img class="card-thumb" src="${encodeURIComponent(s.file)}" alt="${s.name} 꿈카드" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="student-name">${s.name}</span>
              <span class="job-badge">${s.job}</span>
            </div>
            <div class="headline-preview-pill">
              <span class="label">대표 추천 헤드카피</span>
              <div class="text">"${s.headlines[0].text}"</div>
            </div>
            <div class="card-footer">
              <span>추천 문구 3개</span>
              <span class="view-btn">보러가기 ➔</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = studentsData.filter(s => 
        s.name.toLowerCase().includes(q) || 
        s.job.toLowerCase().includes(q) ||
        s.headlines.some(h => h.text.toLowerCase().includes(q))
      );
      renderStudents(filtered);
    });

    function openModal(student) {
      currentStudent = student;
      selectedHeadline = student.headlines[0].text;

      document.getElementById('modalName').textContent = `${student.name}의 꿈카드`;
      document.getElementById('modalJob').textContent = student.job;
      document.getElementById('modalImg').src = encodeURIComponent(student.file);

      const customInp = document.getElementById('customInput');
      customInp.value = '';
      document.getElementById('charCount').textContent = '0자';

      renderOptions();

      document.getElementById('modalBackdrop').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function renderOptions() {
      const container = document.getElementById('optionsGrid');
      container.innerHTML = '';

      currentStudent.headlines.forEach((h, idx) => {
        const item = document.createElement('div');
        const isSelected = (h.text === selectedHeadline);
        item.className = `option-item ${isSelected ? 'selected' : ''}`;
        item.onclick = () => {
          selectedHeadline = h.text;
          document.getElementById('customInput').value = '';
          document.getElementById('charCount').textContent = '0자';
          renderOptions();
        };

        item.innerHTML = `
          <div class="option-left">
            <span class="option-num">${idx + 1}</span>
            <div>
              <span style="font-size: 0.75rem; font-weight: 800; color: #4F46E5; background: #EEF2FF; padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 4px;">#${h.val}</span>
              <div class="option-text">"${h.text}"</div>
            </div>
          </div>
          <span class="option-len">${h.text.length}자</span>
        `;
        container.appendChild(item);
      });
    }

    function onCustomType(val) {
      document.getElementById('charCount').textContent = `${val.length}자`;
      if (val.trim().length > 0) {
        selectedHeadline = val.trim();
        const items = document.querySelectorAll('.option-item');
        items.forEach(it => it.classList.remove('selected'));
      } else {
        selectedHeadline = currentStudent.headlines[0].text;
        renderOptions();
      }
    }

    function prevStudent() {
      if (!currentStudent) return;
      const idx = studentsData.findIndex(s => s.id === currentStudent.id);
      const prevIdx = (idx - 1 + studentsData.length) % studentsData.length;
      openModal(studentsData[prevIdx]);
    }

    function nextStudent() {
      if (!currentStudent) return;
      const idx = studentsData.findIndex(s => s.id === currentStudent.id);
      const nextIdx = (idx + 1) % studentsData.length;
      openModal(studentsData[nextIdx]);
    }

    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('modalBackdrop');
      if (modal.classList.contains('active')) {
        if (e.key === 'Escape') closeModal();
        if (e.target.tagName !== 'INPUT') {
          if (e.key === 'ArrowLeft') prevStudent();
          if (e.key === 'ArrowRight') nextStudent();
        }
      }
    });

    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });

    renderStudents(studentsData);
  </script>
